# Alertmanager配置
global:
  resolve_timeout: 5m

# 路由配置
route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'feishu-webhook'

  # 子路由
  routes:
    # Critical告警立即发送
    - match:
        severity: critical
      receiver: 'feishu-webhook'
      group_wait: 0s
      repeat_interval: 30m

    # Warning告警合并发送
    - match:
        severity: warning
      receiver: 'feishu-webhook'
      group_wait: 30s
      repeat_interval: 2h

# 接收器配置
receivers:
  # 飞书Webhook接收器
  - name: 'feishu-webhook'
    webhook_configs:
      - url: 'http://host.docker.internal:8000/api/monitoring/alert'
        send_resolved: true
        http_config:
          follow_redirects: true

# 抑制规则
inhibit_rules:
  - source_match:
      severity: 'critical'
      alertname: 'ServiceDown'
    target_match:
      severity: 'warning'
    equal: ['instance']
