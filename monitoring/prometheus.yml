# Prometheus配置文件
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'travel-agent-production'
    environment: 'development'

# 告警规则文件
rule_files:
  - 'alerts.yml'

# Alertmanager配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# 抓取配置
scrape_configs:
  # 监控Prometheus自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 监控FastAPI应用
  - job_name: 'travel-agent-api'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'travel-agent'
          app: 'api'
    metrics_path: '/metrics'
    scrape_interval: 10s
